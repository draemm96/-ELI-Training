<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#100d15" />
<title>ELI Training</title>
<style>
:root{--bg:#100d15;--panel:#1a1620;--panel2:#221c2b;--text:#f6f1fb;--muted:#aaa0b8;--purple:#a77cff;--purple2:#7e5ac8;--line:#352c3f;--green:#64d49c;--orange:#f6b85a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#100d15,#0d0b11 60%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}.app{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-size:28px;font-weight:900;letter-spacing:-.8px}.pill{padding:8px 12px;border-radius:999px;background:#271d33;color:#c9aaff;font-weight:700;font-size:13px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0 18px}.day{border:1px solid var(--line);background:#17131c;border-radius:14px;padding:10px 4px;text-align:center;color:var(--muted);font-size:12px}.day b{display:block;color:var(--text);font-size:16px;margin-top:2px}.day.active{background:var(--purple);border-color:var(--purple);color:#21182d}.day.active b{color:#160f1d}.hero{background:linear-gradient(135deg,#2a1d3a,#191521);border:1px solid #4a3960;border-radius:22px;padding:20px;margin-bottom:14px}.eyebrow{font-size:12px;letter-spacing:.13em;color:#bb93ff;font-weight:800}.hero h1{margin:8px 0 6px;font-size:34px;line-height:1}.hero p{margin:0;color:var(--muted);font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.section-title span{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}.exercise-head{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}.exercise-head h3{margin:0 0 4px;font-size:18px}.meta{color:var(--muted);font-size:13px}.chev{color:#b897ef;font-size:20px}.exercise-body{display:none;border-top:1px solid var(--line);padding:14px}.card.open .exercise-body{display:block}.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 1fr 42px;gap:8px;align-items:center}.setgrid .hdr{font-size:11px;color:var(--muted);text-align:center}.setn{font-weight:800;color:#b796eb}.input{width:100%;background:#100d15;border:1px solid #3d3348;color:var(--text);border-radius:10px;padding:11px 8px;text-align:center;font-size:15px}.setcheck{width:40px;height:40px;border-radius:12px;border:1px solid #4a3d58;background:#100d15;color:#8f839c;font-size:18px;font-weight:900}.setcheck.done{background:#173426;border-color:#28563f;color:#7ce3ac}.timerbar{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));width:min(720px,calc(100% - 24px));background:rgba(31,24,40,.97);backdrop-filter:blur(16px);border:1px solid #5a4772;border-radius:18px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.timerbar.show{display:flex}.timercircle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#a77cff;color:#170f20;font-weight:900;font-size:17px;flex:none}.timertext{min-width:0;flex:1}.timertext strong{display:block;font-size:14px}.timertext span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timeractions{display:flex;gap:6px}.timeractions button{border:1px solid #4a3d58;background:#17131c;color:var(--text);border-radius:10px;padding:9px 10px;font-weight:800}.notes{width:100%;margin-top:10px;background:#100d15;border:1px solid #3d3348;color:var(--text);border-radius:12px;padding:11px;resize:vertical;min-height:52px}.prev{margin-top:9px;color:#8f839c;font-size:12px}.complete{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;background:#2d2240;color:#d7c4fa;font-weight:800}.complete.done{background:#173426;color:#7ce3ac}.runbox{padding:16px}.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rungrid label{font-size:12px;color:var(--muted)}.rungrid input,.rungrid select{width:100%;margin-top:5px;background:#100d15;border:1px solid #3d3348;color:var(--text);border-radius:12px;padding:12px}.summary{background:#17131c;border:1px dashed #4b3d5a;border-radius:18px;padding:16px;margin-top:14px}.summary-row{display:flex;justify-content:space-between;margin:6px 0;color:var(--muted)}.summary-row strong{color:var(--text)}.cta{width:100%;border:none;border-radius:16px;padding:15px;background:var(--purple);color:#170f20;font-weight:900;font-size:16px;margin-top:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,12,19,.94);backdrop-filter:blur(14px);border-top:1px solid #2b2433;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.navbtn{background:none;border:0;color:#8f839c;font-weight:700;padding:8px}.navbtn.active{color:#c5a6ff}.hidden{display:none!important}.progress-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.big{font-size:34px;font-weight:900;color:#c0a0ff}.tiny{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">ELI Training</div><div class="pill">Strength + Run</div></div>
  <div class="days" id="days"></div>
  <div id="todayView"></div>
  <div id="historyView" class="hidden"></div>
  <div id="progressView" class="hidden"></div>
</div>
<div class="timerbar" id="timerbar"><div class="timercircle" id="timerclock">00:00</div><div class="timertext"><strong>Rest timer</strong><span id="timerlabel">Next set</span></div><div class="timeractions"><button onclick="addTimer(30)">+30</button><button onclick="stopTimer()">Skip</button></div></div>
<div class="nav"><div class="navinner"><button class="navbtn active" data-view="today">Today</button><button class="navbtn" data-view="history">History</button><button class="navbtn" data-view="progress">Progress</button></div></div>
<script>
const schedule={
0:{name:'Long Run',type:'run',focus:'Easy aerobic endurance'},
1:{name:'Upper A',type:'lift',focus:'Back + Chest',ex:[['Lat Pulldown',3,'8–12','90s'],['Machine Chest Press',3,'8–12','90s'],['Seated Row',3,'8–12','90s'],['DB Chest Press',2,'10–12','90s'],['Single-Arm Lat Pulldown',2,'10–12/arm','75s'],['Face Pull',2,'12–15','60s']]},
2:{name:'Lower A',type:'lift',focus:'Quads + Glutes',ex:[['Heel-Elevated Smith Squat',3,'6–10','2–3m'],['Hip Thrust',3,'8–10','2–3m'],['Leg Press',3,'10–12','2m'],['Leg Extension',3,'10–15','75s'],['Hip Abduction Machine',3,'15–20','60–90s'],['Calf Raise',3,'10–15','60–90s']]},
3:{name:'Rest Day',type:'rest',focus:'Recovery'},
4:{name:'Upper B',type:'lift',focus:'Shoulders + Arms',ex:[['Machine Shoulder Press',3,'8–12','90s'],['Lateral Raise',3,'12–15','60s'],['Rear-Delt Fly',3,'12–15','60s'],['Lat Pulldown (alternate grip)',2,'10–12','90s'],['Cable Triceps Pushdown',3,'10–15','60–75s'],['DB Biceps Curl',3,'10–15','60–75s'],['Cable Curl',2,'12–15','60s']]},
5:{name:'Outdoor Run',type:'run',focus:'Quality / easy run'},
6:{name:'Lower B',type:'lift',focus:'Hamstrings + Glutes',ex:[['Romanian Deadlift',3,'6–10','2–3m'],['Bulgarian Split Squat',3,'8–12/leg','2m'],['B-Stance Hip Thrust',3,'8–12/side','90–120s'],['Seated Leg Curl',3,'10–15','75s'],['Glute Medius Kickback',2,'12–20/leg','60s'],['Adduction Machine',2,'12–15','60s'],['Calf Raise',3,'12–15','60–90s']]}
};
const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let selected=new Date().getDay();
const store=JSON.parse(localStorage.getItem('eliTraining')||'{}');
const save=()=>localStorage.setItem('eliTraining',JSON.stringify(store));
function dateKey(day){const n=new Date(), diff=day-n.getDay(); n.setDate(n.getDate()+diff); return n.toISOString().slice(0,10)}
function renderDays(){const el=document.getElementById('days'); el.innerHTML=dn.map((d,i)=>`<div class="day ${i===selected?'active':''}" onclick="selected=${i};render()">${d}<b>${i===0?7:i}</b></div>`).join('')}
function hero(s){return `<div class="hero"><div class="eyebrow">${s.type==='rest'?'RECOVERY':s.type==='run'?'RUNNING':'TRAINING'}</div><h1>${s.name}</h1><p>${s.focus}</p></div>`}
function liftView(s){const key=dateKey(selected); if(!store[key])store[key]={}; let total=s.ex.reduce((a,e)=>a+e[1],0); return hero(s)+`<div class="section-title"><h2>Workout</h2><span>${total} working sets</span></div>`+s.ex.map((e,idx)=>{const [name,sets,reps,rest]=e; const saved=store[key][name]||{}; const rows=Array.from({length:sets},(_,j)=>`<div class="setn">${j+1}</div><input class="input" inputmode="decimal" placeholder="lb" value="${saved['w'+j]||''}" oninput="upd('${key}','${esc(name)}','w${j}',this.value)"><input class="input" inputmode="numeric" placeholder="reps" value="${saved['r'+j]||''}" oninput="upd('${key}','${esc(name)}','r${j}',this.value)"><input class="input" inputmode="numeric" placeholder="RIR" value="${saved['i'+j]||''}" oninput="upd('${key}','${esc(name)}','i${j}',this.value)"><button class="setcheck ${saved['d'+j]?'done':''}" aria-label="Mark set ${j+1} complete" onclick="event.stopPropagation();setDone('${key}','${esc(name)}',${j},'${rest}',this)">${saved['d'+j]?'✓':'○'}</button>`).join('');return `<div class="card"><div class="exercise-head" onclick="this.parentElement.classList.toggle('open')"><div><h3>${name}</h3><div class="meta">${sets} × ${reps} · rest ${rest}</div></div><div class="chev">⌄</div></div><div class="exercise-body"><div class="setgrid"><div></div><div class="hdr">WEIGHT</div><div class="hdr">REPS</div><div class="hdr">RIR</div><div class="hdr">DONE</div>${rows}</div><textarea class="notes" placeholder="Notes" oninput="upd('${key}','${esc(name)}','notes',this.value)">${saved.notes||''}</textarea><div class="prev">Tip: keep your current working weights and beat reps before increasing load.</div><button class="complete ${saved.done?'done':''}" onclick="done('${key}','${esc(name)}',this)">${saved.done?'Completed ✓':'Mark exercise complete'}</button></div></div>`}).join('')+`<div class="summary"><div class="summary-row"><span>Progression</span><strong>Top of range + 1–2 RIR</strong></div><div class="summary-row"><span>Then</span><strong>Increase load next time</strong></div></div><button class="cta" onclick="alert('Workout saved on this device ✓')">Finish Workout</button>`}
function runView(s){const key=dateKey(selected); const x=store[key]||{}; return hero(s)+`<div class="card"><div class="runbox"><div class="rungrid"><label>Distance (mi)<input inputmode="decimal" value="${x.distance||''}" oninput="runupd('${key}','distance',this.value)"></label><label>Time<input placeholder="00:00" value="${x.time||''}" oninput="runupd('${key}','time',this.value)"></label><label>Average HR<input inputmode="numeric" value="${x.hr||''}" oninput="runupd('${key}','hr',this.value)"></label><label>RPE (1–10)<input inputmode="numeric" value="${x.rpe||''}" oninput="runupd('${key}','rpe',this.value)"></label></div><textarea class="notes" placeholder="How did the run feel?" oninput="runupd('${key}','notes',this.value)">${x.notes||''}</textarea><button class="cta" onclick="alert('Run saved on this device ✓')">Save Run</button></div></div>`}
function restView(s){return hero(s)+`<div class="progress-card"><div class="big">Recover</div><div class="tiny">No scheduled lifting or running today. Normal walking and mobility are fine.</div></div>`}
function esc(s){return s.replaceAll("'","\\'")}
let timerEnd=0,timerInt=null,timerExercise='';
function restSeconds(rest){const nums=(rest.match(/\d+/g)||[]).map(Number);if(!nums.length)return 90;if(rest.includes('m'))return Math.max(...nums)*60;return Math.max(...nums)}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function drawTimer(){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));document.getElementById('timerclock').textContent=fmt(left);if(left<=0){clearInterval(timerInt);timerInt=null;document.getElementById('timerlabel').textContent='Rest complete — next set';if(navigator.vibrate)navigator.vibrate([120,80,120]);}}
function startTimer(sec,name){clearInterval(timerInt);timerEnd=Date.now()+sec*1000;timerExercise=name;document.getElementById('timerlabel').textContent=name+' · next set in';document.getElementById('timerbar').classList.add('show');drawTimer();timerInt=setInterval(drawTimer,250)}
window.stopTimer=()=>{clearInterval(timerInt);timerInt=null;timerEnd=0;document.getElementById('timerbar').classList.remove('show')};
window.addTimer=(sec)=>{if(!timerEnd)return;timerEnd+=sec*1000;drawTimer()};
window.setDone=(k,n,j,rest,b)=>{store[k]=store[k]||{};store[k][n]=store[k][n]||{};const f='d'+j;store[k][n][f]=!store[k][n][f];save();b.classList.toggle('done');b.textContent=store[k][n][f]?'✓':'○';if(store[k][n][f])startTimer(restSeconds(rest),n+' · set '+(j+1)+' complete')};
window.upd=(k,n,f,v)=>{store[k]=store[k]||{};store[k][n]=store[k][n]||{};store[k][n][f]=v;save()};window.done=(k,n,b)=>{store[k]=store[k]||{};store[k][n]=store[k][n]||{};store[k][n].done=!store[k][n].done;save();b.classList.toggle('done');b.textContent=store[k][n].done?'Completed ✓':'Mark exercise complete'};window.runupd=(k,f,v)=>{store[k]=store[k]||{};store[k][f]=v;save()}
function history(){const keys=Object.keys(store).sort().reverse(); return `<div class="hero"><div class="eyebrow">LOG</div><h1>History</h1><p>Your saved workouts on this device.</p></div>`+(keys.length?keys.map(k=>`<div class="progress-card"><strong>${k}</strong><div class="tiny">${Object.keys(store[k]).length} saved entries</div></div>`).join(''):`<div class="progress-card">No workouts saved yet.</div>`)}
function progress(){return `<div class="hero"><div class="eyebrow">PROGRESS</div><h1>Build & Run</h1><p>Use consistent weights, reps and RIR so progression is measurable.</p></div><div class="progress-card"><div class="big">1–3 RIR</div><div class="tiny">Default target for most working sets.</div></div><div class="progress-card"><div class="big">6–20 reps</div><div class="tiny">Compounds lower; isolation work higher. Progress when you own the top of the range.</div></div>`}
function render(){renderDays();const s=schedule[selected];document.getElementById('todayView').innerHTML=s.type==='lift'?liftView(s):s.type==='run'?runView(s):restView(s)}
[...document.querySelectorAll('.navbtn')].forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');['todayView','historyView','progressView'].forEach(id=>document.getElementById(id).classList.add('hidden'));const v=b.dataset.view;if(v==='today'){document.getElementById('todayView').classList.remove('hidden');render()}if(v==='history'){document.getElementById('historyView').classList.remove('hidden');document.getElementById('historyView').innerHTML=history()}if(v==='progress'){document.getElementById('progressView').classList.remove('hidden');document.getElementById('progressView').innerHTML=progress()}})
render();
</script>
</body>
</html>
